[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --html=reports/pytest_report.html --self-contained-html
markers =
    unit: fast tests of single functions, no API server needed
    api: API contract tests over HTTP (status codes, schemas, validation)
    quality: golden Q&A tests (answer quality, retrieval, groundedness)
    safety: prompt-injection, jailbreak and PII-leakage tests
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
