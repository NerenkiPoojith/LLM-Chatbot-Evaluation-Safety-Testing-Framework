# Render Blueprint: free Docker web service for the chatbot (API + web pages).
# Render dashboard -> New -> Blueprint -> pick this repo. No secrets needed: the
# public demo uses the free offline answerer (LLM_PROVIDER=mock, set in the Dockerfile).
services:
  - type: web
    name: appliance-help
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
